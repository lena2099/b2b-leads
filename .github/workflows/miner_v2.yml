name: B2B Lead Miner v2 — Hourly

on:
  schedule:
    - cron: '0 * * * *'          # Every hour at :00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl -q

      - name: Run Lead Miner
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p data output
          python .github/scripts/miner_v2.py

      - name: Build Dashboard
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/scripts/build_dashboard.py

      - name: Commit & Push
        run: |
          git config user.name "B2B Miner Bot"
          git config user.email "bot@b2bleads.local"
          git pull origin main --rebase || true
          git add -A
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "🌍 Auto: lead mining $(date -u +%Y-%m-%d_%H:%M)" && git push
          )
