name: B2B Lead Miner v3 — Hourly Deep Research

on:
  schedule:
    - cron: '0 * * * *'          # Every hour at :00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Lead Miner v3
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p data output
          python .github/scripts/miner_v3.py

      - name: Rebuild Dashboard (every 6th hour)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          HOUR=$(date -u +%H)
          if [ $((10#$HOUR % 6)) -eq 0 ]; then
            pip install openpyxl -q
            python .github/scripts/build_dashboard.py
            echo "✅ Dashboard rebuilt"
          else
            echo "⏭️  Skipping dashboard rebuild (hour=$HOUR)"
          fi

      - name: Commit & Push
        run: |
          git config user.name "B2B Miner Bot"
          git config user.email "bot@b2bleads.local"
          git pull origin main --rebase || true
          git add -A
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "🌍 Auto: deep research $(date -u +%Y-%m-%d_%H:%M)" && git push
          )
